[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-autopilot"
version = "0.1.0"
description = "Automated profiling, cleaning, feature engineering, modeling and reporting for arbitrary tabular datasets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Basith Shahul Hameed Buhari" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
tabular-autopilot = "tabular_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabular_autopilot = ["templates/*.html"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
